id: cortos_con_inventario_y_ubicaciones

nombre: Cortos con Inventario y Ubicaciones Disponibles

descripcion: Lista los artículos con cantidad rechazada y con inventario disponible, mostrando la cantidad disponible total, las ubicaciones que cuentan con inventario disponible y la bodega correspondiente a la ubicación prioritaria del artículo.

proposito: Identificar artículos con cortos que pueden ser surtidos con inventario disponible en Mariano, mostrando la cantidad disponible y las ubicaciones donde se encuentra dicho inventario.

database: sql-server

tablas: [shipment_detail, location_inventory, location]

parametros: []

tags: [cortos, inventario, disponible, ubicaciones, surtido, Mariano, Reporte]

alias: [cortos con inventario, cortos disponibles, cortos y ubicaciones, inventario para cortos, artículos con corto e inventario]

ultima_verificacion: 2026-08-26

estatus: estable

publicar: true

notas: "La cantidad RECHAZADA se obtiene sumando TOTAL_QTY de los detalles de pedido con STATUS1 = 100 y ALLOCATION_REJECTED_QTY > 0. DISP representa el inventario disponible y se calcula como (ON_HAND_QTY + IN_TRANSIT_QTY) - (ALLOCATED_QTY + SUSPENSE_QTY), considerando únicamente ubicaciones de clase Inventory y excluyendo MERMA-00, MERMA-01, MERMA-02, MERMA-03 e INTERNET-01. LOCATIONS muestra las ubicaciones que tienen disponibilidad mayor a cero. La BODEGA corresponde a la WORK_ZONE de la ubicación prioritaria del artículo, determinada mediante ROW_NUMBER(), dando prioridad a ubicaciones PERMANENT = 'Y' y posteriormente a las zonas de bodega y No Banda. PISO clasifica las WORK_ZONE de Mariano en Piso 1 o Piso 2."
