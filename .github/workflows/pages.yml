name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar el deploy manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys corran al mismo tiempo; si hay uno en curso y llega
# un push nuevo, se cancela el anterior en vez de dejarlos pelear entre sí.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (carpeta web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
