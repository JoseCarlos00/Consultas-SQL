name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar el deploy manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos deploys corran al mismo tiempo; si hay uno en curso y llega
# un push nuevo, se cancela el anterior en vez de dejarlos pelear entre sí.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: generate_catalog.py lo necesita para 'git log' (ultima_modificacion)

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pyyaml

      - name: Validar catálogo (falla el deploy si hay .yml inválidos o incompletos)
        run: python generate_catalog.py --check

      - name: Generar catalog.json
        run: python generate_catalog.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (carpeta web/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
