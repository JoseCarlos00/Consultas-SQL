id: UPDATE_location_capacity

nombre: Actualizar Capacidad de Artículos

descripcion: Actualiza la configuración de capacidad y reposición de una lista de artículos en ubicaciones de tipo Generica Permanente S, permitiendo establecer valores diferentes para cada artículo.

proposito: Modificar manualmente la capacidad máxima, el porcentaje mínimo de reposición y la unidad de medida de capacidad de artículos seleccionados.

database: sql-server

tablas: [item_location_capacity]

parametros:

  - descripcion: Lista de artículos que se desean modificar.

    ejemplo: "('1128-8879-26851'), ('1128-8879-26852')"

    ubicacion: "WHERE ITEM IN (...)"

  - descripcion: Capacidad máxima que se asignará a cada artículo. El valor puede establecerse individualmente mediante los CASE WHEN.

    ejemplo: "1128-8879-26851 = 2"

    ubicacion: "CASE WHEN ITEM = '1128-8879-26851' THEN 2 ELSE MAXIMUM_QTY END"

  - descripcion: Porcentaje mínimo de reposición que se asignará a cada artículo. El valor puede establecerse individualmente mediante los CASE WHEN.

    ejemplo: "1128-8879-26851 = 50"

    ubicacion: "CASE WHEN ITEM = '1128-8879-26851' THEN 50 ELSE MINIMUM_RPLN_PCT END"

  - descripcion: Unidad de medida utilizada para la capacidad.

    ejemplo: "CJ"

    ubicacion: "QUANTITY_UM = 'CJ'"

tags: [capacidad, reposición, artículos, ubicaciones, configuración, utilidad, utils]

alias: [actualizar capacidad de artículos, cambiar capacidad, configurar capacidad, actualizar reposición, modificar capacidad por artículo]

ultima_verificacion:

estatus: estable

publicar: true

notas: "Consulta de actualización directa sobre item_location_capacity. Está pensada para asignar valores diferentes de capacidad y reposición a cada artículo mediante CASE WHEN. Solo afecta registros de LOCATION_TYPE Generica Permanente S y artículos incluidos en ITEM IN (...). Es importante completar tanto los CASE como la lista de ITEM antes de ejecutar. El ELSE hace que cualquier registro seleccionado que no tenga un CASE correspondiente tenga su valor actual."
