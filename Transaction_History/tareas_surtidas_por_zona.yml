id: tareas_surtidas_por_zona

nombre: Tareas Surtidas por Zona

descripcion: Resume las tareas y líneas de surtido realizadas en Mariano, agrupándolas por piso y tipo de pedido.

proposito: Consultar la cantidad de tareas y líneas surtidas por piso y tipo de pedido durante una fecha determinada.

database: sql-server

tablas: [transaction_history, location]

parametros: []

tags: [surtido, tareas, lineas, zonas, productividad, Mariano, Reporte]

alias: [tareas surtidas por zona, líneas surtidas por zona, surtido por piso, reporte de surtido]

ultima_verificacion:

estatus: estable

publicar: true

notas: "La consulta utiliza transaction_history con transaction_type = 130 y direction = FROM para identificar confirmaciones de surtido. Agrupa las transacciones en 1ER PISO y 2DO PISO según WORK_ZONE y clasifica el tipo de pedido mediante reference_id: TIENDA, CLIENTES, INTERNET o MAYOREO. TAREAS_SURTIDAS corresponde al número de WORK_UNIT distintos y LINEAS_SURTIDAS al número de registros resultantes. La fecha se ajusta seis horas para representar la fecha operativa de Mariano."
