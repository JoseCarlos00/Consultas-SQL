id: Inventario_HOT

nombre: Inventario de HOT

descripcion: Lista el inventario con existencia en ubicaciones HOT del almacén Mariano, mostrando la ubicación, artículo, existencias en piezas y cajas, bodega, ubicación de picking y piso.

proposito: Consultar el inventario existente en las ubicaciones HOT de Mariano y su distribución por bodega y zona.

database: sql-server

tablas: [location_inventory, Item_unit_of_measure, location, item_location_assignment]

parametros: []

tags: [inventario, HOT, ubicaciones, existencias, picking, Mariano]

alias: [inventario HOT, inventario de HOT, existencias HOT]

ultima_verificacion: 2026-08-18

estatus: estable

publicar: true

notas: "Solo considera ubicaciones cuyo nombre comienza con HOT y tienen ON_HAND_QTY mayor a cero. CAJAS se calcula usando UOM sequence 2 y se presenta con dos decimales. WORK_ZONE y ZONA se obtienen a partir de la zona prioritaria asociada al artículo."
