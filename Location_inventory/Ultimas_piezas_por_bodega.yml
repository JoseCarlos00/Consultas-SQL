id: Ultimas_Piezas_por_Bodega

nombre: Ultimas Piezas por Bodega

descripcion: Lista artículos ubicados en picking de una bodega que conservan entre 1 y 25 piezas y que no tienen inventario disponible para reposición en otras ubicaciones.

proposito: Identificar artículos con inventario bajo en picking que ya no cuentan con una fuente de reposición disponible.

database: sql-server

tablas: [location_inventory, item_location_capacity, location, item]

parametros:
  - descripcion: Bodega que se desea consultar. El valor debe sustituirse en todas las apariciones de WORK_ZONE indicadas antes de ejecutar la consulta.
    ejemplo: "W-Mar Bodega 6"
    ubicacion: "L.work_zone = 'W-Mar Bodega 6' y L.work_zone <> 'W-Mar Bodega 6' y L.work_zone = 'W-Mar Bodega 6'"

tags: [picking, inventario, reposicion, faltantes, bodega, Mariano]

alias: [picking bajo, picking sin reposicion, sin inventario para reposicion, faltantes de picking, picking critico]

ultima_verificacion: 2026-08-18

estatus: estable

publicar: true

notas: "La consulta está limitada a una bodega para facilitar las pruebas. Al reutilizarla, sustituir W-Mar Bodega 6 por la bodega deseada en las 2 apariciones de WORK_ZONE. Las ubicaciones Generica Permanente S y Generica Dinamico S se consideran picking. El rango de inventario bajo es de 1 a 25 piezas."
