id: consulta_inventario_personalizada

nombre: Consulta de Inventario Personalizada

descripcion: Consulta el inventario de ubicaciones del almacén Mariano mostrando ubicación, artículo, descripción, compañía, inventario disponible, existencia física, asignado, en tránsito, suspendido y licencia de manejo. Está diseñada como plantilla para agregar o modificar filtros según la necesidad de la consulta.

proposito: Realizar consultas personalizadas de inventario cuando la interfaz del WMS no proporciona el nivel de detalle o los filtros necesarios.

database: sql-server

tablas: [location_inventory, location, item]

parametros: []

tags: [utilidad, utils, inventario, consulta, personalizada, Mariano]

alias: [consulta de inventario, inventario personalizado, consulta personalizada de inventario, inventario detallado, utilidad de inventario]

ultima_verificacion: 2026-08-25

estatus: estable

publicar: true

notas: "La consulta utiliza como base las ubicaciones de tipo Generica del almacén Mariano. WORK_ZONE está limitada inicialmente a W-Mar Bodega 2 como medida de seguridad para evitar obtener demasiados registros durante las pruebas. Los filtros por LOCATION e ITEM pueden habilitarse o modificarse según la necesidad. AV se calcula como (ON_HAND_QTY + IN_TRANSIT_QTY) - (ALLOCATED_QTY + SUSPENSE_QTY)."
