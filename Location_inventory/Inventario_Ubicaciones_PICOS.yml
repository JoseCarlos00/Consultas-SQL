id: Inventario_Ubicaciones_PICOS

nombre: Inventario de Picos

descripcion: Lista el inventario con existencia en ubicaciones PICOS del almacén Mariano, mostrando la ubicación, artículo, existencias en piezas y cajas, bodega, ubicación de picking y piso.

proposito: Consultar el inventario existente en las ubicaciones PICOS de Mariano y su distribución por bodega y zona.

database: sql-server

tablas: [location_inventory, item_unit_of_measure, location, item_location_assignment]

parametros: []

tags: [inventario, picos, ubicaciones, existencias, picking, Mariano]

alias: [inventario picos, inventario de picos, existencias picos]

ultima_verificacion: 2026-08-18

estatus: estable

publicar: true

notas: "Solo considera ubicaciones cuyo nombre comienza con PICOS y tienen ON_HAND_QTY mayor a cero. CAJAS se calcula usando UOM sequence 2 y se presenta con dos decimales. WORK_ZONE y ZONA se obtienen a partir de la zona prioritaria asociada al artículo."
