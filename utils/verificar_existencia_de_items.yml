id: verificar_existencia_de_items

nombre: Validar existencia de artículos

descripcion: Identifica cuáles de los artículos proporcionados en una lista no existen en la tabla de artículos del WMS.

proposito: Validar rápidamente una lista de artículos antes de utilizarlos en configuraciones, cargas o consultas, mostrando únicamente aquellos que no se encuentran registrados.

database: sql-server

tablas: [item]

parametros:

  - descripcion: Lista de artículos que se desean validar. Los artículos se agregan manualmente dentro de la sección VALUES de la consulta.

    ejemplo: "('ITEM-001'), ('ITEM-002'), ('ITEM-003')"

    ubicacion: "VALUES ('ITEM_1'), ('ITEM_2'), ..."

tags: [artículos, validación, utilidad, utils]

alias: [validar artículos, artículos inexistentes, revisar artículos, comprobar artículos, validar SKUs, artículos no registrados]

ultima_verificacion:

estatus: estable

publicar: true

notas: "Utiliza NOT EXISTS para comparar la lista proporcionada contra la tabla item y devuelve únicamente los artículos que no existen. La lista se captura manualmente mediante VALUES. La consulta puede adaptarse para validar contra otra fuente de artículos, como item_location_assignment, modificando la tabla indicada en el subquery."
