id: verificar_ubicaciones_frozen_held

nombre: Verificar Ubicaciones Frozen y Held

descripcion: Lista las ubicaciones de clase Inventory del almacén Mariano que se encuentran en estado Frozen o que contienen inventario con estado Held, mostrando la configuración de la ubicación y el estado del inventario.

proposito: Detectar y revisar ubicaciones congeladas o inventario retenido que puedan representar una inconsistencia o requerir atención en el WMS.

database: sql-server

tablas: [location, location_inventory]

parametros: []

tags: [utilidad, utils, inventario, ubicaciones, frozen, held, inconsistencias, Mariano]

alias: [ubicaciones frozen, inventario held, ubicaciones congeladas, inventario retenido, revisar frozen, revisar held]

ultima_verificacion: 2026-08-25

estatus: estable

publicar: true

notas: "Considera únicamente ubicaciones de clase Inventory del almacén Mariano. Se muestran registros cuando LOCATION_STS = 'Frozen' o INVENTORY_STS = 'Held'. No se filtra por ON_HAND_QTY, por lo que también permite detectar ubicaciones o inventarios Frozen/Held sin existencia física."
