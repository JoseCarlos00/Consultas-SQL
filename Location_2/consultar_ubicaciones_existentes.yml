id: consultar_ubicaciones_existentes

nombre: Consulta de ubicaciones existentes

descripcion: Consulta las características de una lista específica de ubicaciones, mostrando su almacén, tipo, zonas, configuración y estado. También permite identificar ubicaciones proporcionadas en la lista que no existen en la tabla de ubicaciones.

proposito: Verificar rápidamente la configuración y existencia de una o varias ubicaciones específicas en el WMS.

database: sql-server

tablas: [location]

parametros:

  - descripcion: Lista de ubicaciones que se desean consultar. Las ubicaciones se agregan manualmente dentro de la sección VALUES de la consulta.

    ejemplo: "('2-10-07-AA-01'), ('2-10-07-AA-02')"

    ubicacion: "VALUES ('UBICACION_1'), ('UBICACION_2'), ..."

tags: [ubicaciones, consulta, utilidad, utils, configuracion, WMS]

alias: [consulta de ubicaciones, revisar ubicaciones, verificar ubicaciones, configuracion de ubicaciones, lista de ubicaciones]

ultima_verificacion:

estatus: estable

publicar: true

notas: "La lista de ubicaciones se proporciona manualmente mediante VALUES. La consulta conserva las ubicaciones de la lista aunque no existan en la tabla location, permitiendo detectar ubicaciones inexistentes o no configuradas. Muestra warehouse, location_type, allocation_zone, work_zone, locating_zone, multi_item, track_containers y location_sts."
